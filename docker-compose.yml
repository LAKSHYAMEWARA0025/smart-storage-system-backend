version: '3.8'

services:
  # FastAPI Application
  api:
    build: .
    container_name: smart-storage-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    restart: unless-stopped

  # Celery Worker
  celery_worker:
    build: .
    container_name: smart-storage-worker
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - .env
    volumes:
      - .:/app
    restart: unless-stopped
